name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # case: lib-install-path
      - run: pip install .
      # case: lib-program-after-install
      - run: smoke-cli
      # case: lib-action-root
      - uses: ClaudioMascaro/meada-smoke-shared@main
  own-check:
    # case: lib-local-pipeline
    uses: ./.github/workflows/check.yml
